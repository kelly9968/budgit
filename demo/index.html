<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" />
<title>Budgit — Budget on top of your sheet</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script src="https://apis.google.com/js/api.js" async defer></script>
</head>
<body>
<div id="root"></div>
<!-- Static legal links — kept in raw HTML so OAuth verification crawlers
     find them before the SPA boots. The SignIn screen already shows a
     visible privacy/terms link for human reviewers, so this nav is
     visually hidden (off-screen) to avoid overlapping the in-app header. -->
<nav id="static-legal" aria-label="Legal">
  <a href="/privacy.html" rel="noopener">Privacy Policy</a>
  <span aria-hidden="true">·</span>
  <a href="/terms.html" rel="noopener">Terms</a>
</nav>
<style>
  #static-legal {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>
<script type="module" src="/src/main.tsx"></script>
</body>
</html>
