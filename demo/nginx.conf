server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compression for text assets
  gzip on;
  gzip_vary on;
  gzip_min_length 1000;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;
  gzip_comp_level 6;

  # Hashed Vite assets — cache forever, immutable
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must always be fresh so users pick up new bundle hashes
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # SPA fallback — any unknown route serves index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
