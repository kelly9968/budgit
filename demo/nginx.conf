server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compression for text assets
  gzip on;
  gzip_vary on;
  gzip_min_length 1000;
  gzip_proxied any;
  gzip_types text/plain text/css text/xml application/javascript application/json image/svg+xml;
  gzip_comp_level 6;

  # Hashed Vite assets — cache forever, immutable
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html must always be fresh so users pick up new bundle hashes
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # Reviewed native Android release. Keep the stable URL fresh while
  # preserving a phone-friendly attachment filename and correct MIME type.
  location = /downloads/Budgie.apk {
    default_type application/vnd.android.package-archive;
    add_header Content-Disposition 'attachment; filename="Budgie-1.0.0.apk"';
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  location ~ ^/downloads/(budgie-android\.json|Budgie\.apk\.sha256)$ {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    try_files $uri =404;
  }

  # SPA fallback — any unknown route serves index.html
  location / {
    try_files $uri $uri/ /index.html;
  }
}
